# 지니어스 온라인 PC 클라이언트 — PR 은 시험 + 굽기만(읽기 권한), 태그 `v*` 면 GitHub Releases 에 올린다(쓰기 권한은 그 job 에만).
name: build

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: GeniusOnline-Setup
          path: |
            release/GeniusOnline-Setup.exe
            release/latest.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
